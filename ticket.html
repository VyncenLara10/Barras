<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ticket de venta · Barras Studio</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#102735}*{box-sizing:border-box}body{background:#f4f7f5;margin:0;padding:30px 16px}.wrap{max-width:640px;margin:auto}.tools{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 20px}.tools a{color:#14816e;font-weight:700;text-decoration:none}.tools button{cursor:pointer;background:#102735;color:#fff;border:0;border-radius:9px;padding:12px 22px;font-weight:800}.paper{background:#fff;border:1px solid #dbe6df;padding:32px;box-shadow:0 8px 35px #15362d15;margin:auto;max-width:440px}.head{text-align:center;border-bottom:1px dashed #91aaa1;padding-bottom:15px}.head h1{font-size:24px;margin:0 0 4px}.head p,.meta,.foot{color:#5e7273;font-size:12px}.meta{padding:15px 0;display:grid;gap:4px}.lines{width:100%;border-collapse:collapse;font-size:12px}.lines th,.lines td{padding:8px 4px;border-bottom:1px dashed #dfe6e2;text-align:left}.lines th:nth-child(n+2),.lines td:nth-child(n+2){text-align:right}.lines small{color:#71878a}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:20px 0;border-bottom:1px dashed #91aaa1}.foot{text-align:center;margin:25px 0 0;line-height:1.7}.warn{background:#fff5e7;color:#865b2e;border:1px solid #f3ddc0;border-radius:9px;font-size:12px;padding:12px;margin-bottom:16px}.empty{padding:40px;text-align:center}.empty a{color:#087d67}@media print{@page{size:80mm auto;margin:5mm}html,body{background:#fff;margin:0;padding:0}.wrap{max-width:none}.tools,.warn{display:none!important}.paper{border:0;box-shadow:none;max-width:none;width:100%;padding:0}.head h1{font-size:19px}.lines{font-size:10px}.foot,.meta{font-size:10px}}
</style></head><body><div class="wrap"><nav class="tools"><a href="inventario.html#ventas">← Regresar a la caja</a><button id="printBtn" type="button" onclick="window.print()" hidden>Imprimir ticket</button></nav><div class="warn">Este comprobante es de control interno. <b>No es factura fiscal ni documento tributario FEL.</b> Para ventas formales en Guatemala, emite la factura correspondiente mediante un sistema autorizado.</div><article class="paper" id="ticket"><p class="empty">Buscando venta en este navegador...</p></article></div>
<script>
'use strict';(()=>{
 const KEY='barras-studio-inventario-v1',dest=document.getElementById('ticket');
 const params=new URLSearchParams(location.search),id=params.get('venta');
 let sale;
 try{const data=JSON.parse(localStorage.getItem(KEY));sale=data?.sales?.find(s=>s.id===id);}catch{}
 if(!sale||!Array.isArray(sale.items)){dest.innerHTML='<p class="empty">Este ticket no está guardado en este navegador. <a href="inventario.html">Volver al inventario</a></p>';return;}
 const money=c=>'Q '+((Number(c)||0)/100).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
 const node=(tag,text,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e;};
 dest.replaceChildren();
 const head=node('header','', 'head'),title=node('h1',String(sale.store||'Mi tienda').slice(0,90)),desc=node('p','COMPROBANTE INTERNO DE VENTA');head.append(title,desc);dest.append(head);
 const meta=node('div','','meta');const date=new Date(sale.date);meta.append(node('div','Ticket: '+sale.id),node('div','Fecha: '+(Number.isFinite(date.getTime())?date.toLocaleString('es-GT',{dateStyle:'medium',timeStyle:'short'}):'—')));dest.append(meta);
 const table=document.createElement('table');table.className='lines';const thead=document.createElement('thead');const headRow=document.createElement('tr');['Producto','Cant.','P. unit.','Subtotal'].forEach(label=>headRow.append(node('th',label)));thead.append(headRow);table.append(thead);
 const body=document.createElement('tbody');for(const item of sale.items){const tr=document.createElement('tr');const td1=document.createElement('td');td1.append(node('div',item.name||'Producto'),node('small',item.code||''));tr.append(td1,node('td',item.quantity),node('td',money(item.unitCents)),node('td',money(item.subtotalCents)));body.append(tr);}table.append(body);dest.append(table);
 const total=node('div','','total');total.append(node('span','TOTAL'),node('strong',money(sale.totalCents)));dest.append(total);dest.append(node('p','Gracias por tu compra. Conserva este comprobante para tu control.\nNo es una factura fiscal.', 'foot'));document.getElementById('printBtn').hidden=false;
})();
</script></body></html>
